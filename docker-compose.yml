version: '3.3'
services:
    duas:
      image: mqzaidi/duas.mobi
      build: .
      environment:
        - EMAILUSER='qasim@zaidi.me'
        - EMAILPASS=$${EMAILPASS}
        - NODE_ENV=production
        - PDFSERVER=pdfgen
      expose:
        - "3786"
      volumes:
        - public:/usr/src/app/public
        - ./firebase.json:/usr/src/app/firebase.json
        - ./src/data:/usr/src/app/src/data
      restart: always
      networks:
        - webproxy

    pdfgen:
      image: restorecommerce/pdf-rendering-srv
      environment:
        - NODE_ENV=production
        - ALLOW_HTTP=true
      ports:
        - 9000:9000
      networks:
        - webproxy

networks:
  webproxy:
    external: true

volumes:
  public:
